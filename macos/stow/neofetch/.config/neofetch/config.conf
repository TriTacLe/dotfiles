# Neofetch Configuration
# ~/.config/neofetch/config.conf

print_info() {
    prin
    prin "$(color 6)  $(color 7)macOS System Info"
    prin "━━━━━━━━━━━━━━━━━━━━━━━━"
    info "${c1}OS" distro
    info "${c2}Host" model
    info "${c3}Kernel" kernel
    info "${c4}Uptime" uptime
    info "${c5}Packages" packages
    info "${c6}Shell" shell
    info "${c1}Resolution" resolution
    info "${c2}DE" de
    info "${c3}WM" wm
    info "${c4}WM Theme" wm_theme
    info "${c5}Terminal" term
    info "${c6}CPU" cpu
    info "${c1}GPU" gpu
    info "${c2}Memory" memory
    prin
    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="off"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
dele="on"
display="on"
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
background_color=""
stdout="off"
