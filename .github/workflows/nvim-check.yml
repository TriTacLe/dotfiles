name: nvim config check

# Catches a broken Neovim config before it reaches a machine. Installs every
# plugin headless, then opens a buffer per language and fails if anything errors.

permissions:
  contents: read

on:
  push:
    paths:
      - "shared/stow/nvim/**"
      - ".github/workflows/nvim-check.yml"
  pull_request:
    paths:
      - "shared/stow/nvim/**"
      - ".github/workflows/nvim-check.yml"
  workflow_dispatch: {}

concurrency:
  group: nvim-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NVIM_CONFIG: shared/stow/nvim/.config/nvim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          npm install -g tree-sitter-cli

      - name: Link config into place
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE/$NVIM_CONFIG" "$HOME/.config/nvim"

      # LazyVim resolves its plugin set at startup, so a bad spec fails here.
      - name: Install plugins
        run: nvim --headless "+Lazy! sync" +qa

      # Lazy sync starts parser downloads it never finishes. Reusing its cache
      # makes the real install fail on a rename into a non-empty directory, and
      # deleting the cache races the downloads that are still writing to it, so
      # the smoke test gets a cache of its own.
      - name: Smoke test
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/nvim-smoke-cache
        run: nvim --headless -c "luafile $GITHUB_WORKSPACE/$NVIM_CONFIG/scripts/ci-check.lua"

      - name: stylua
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to the version mason installs locally. On latest, a formatter
          # release can turn CI red without anyone touching the config.
          version: 2.3.1
          args: --check ${{ env.NVIM_CONFIG }}
