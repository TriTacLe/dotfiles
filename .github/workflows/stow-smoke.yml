name: stow-smoke

on:
  push:
    branches: [master]
    paths: [install.sh, justfile, 'shared/**', 'arch/**', 'ubuntu/**', 'macos/**', 'server/**', '.github/workflows/stow-smoke.yml']
  pull_request:
    paths: [install.sh, justfile, 'shared/**', 'arch/**', 'ubuntu/**', 'macos/**', 'server/**', '.github/workflows/stow-smoke.yml']

permissions:
  contents: read

jobs:
  stow:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b944cc65c5f28665dfd5fdbf5ed2997c88f5bb4a0aefac7ee8a7ef01893e5ed9
    strategy:
      fail-fast: false
      matrix:
        # Every value the justfile accepts. Only arch used to be exercised, while
        # the workflow already triggered on ubuntu, macos and server paths.
        os: [arch, ubuntu, macos, server]
    env:
      # One HOME for both steps. The stow step used to export it inline, so the
      # health checks then ran against a home nothing had been stowed into.
      HOME: /tmp/home
    steps:
      # -u, not just -y: a partial upgrade against a pinned image can link freshly
      # synced packages against a newer glibc than the image ships.
      - run: |
          pacman -Syu --noconfirm --needed stow just git zsh
          mkdir -p "$HOME"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stow into a scratch home
        run: |
          just stow ${{ matrix.os }}
          test -L "$HOME/.zshrc"
      - name: Desktop packages land where they should
        if: matrix.os == 'arch' || matrix.os == 'ubuntu'
        run: |
          test -L "$HOME/.config/hypr/hyprland.lua"
          test -L "$HOME/.config/uwsm/env"
      - name: Per-host arch overlay lands too
        if: matrix.os == 'arch'
        # env-hyprland ships in arch/stow/hypr-host, so it is arch only.
        run: test -L "$HOME/.config/uwsm/env-hyprland"
      - name: Unstow leaves nothing behind
        run: |
          just unstow ${{ matrix.os }}
          test ! -e "$HOME/.zshrc"
          test ! -e "$HOME/.claude"
      - name: Repo health checks
        if: matrix.os == 'arch'
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash shared/scripts/verify-system.sh

  # The installer itself, as a stranger would run it: no SSH key for the private
  # submodule, no --system, and package managers stubbed to log their arguments
  # so the script's own logic runs end to end without downloading a desktop.
  install:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b944cc65c5f28665dfd5fdbf5ed2997c88f5bb4a0aefac7ee8a7ef01893e5ed9
    strategy:
      fail-fast: false
      matrix:
        os: [arch, ubuntu]
    env:
      HOME: /tmp/home
      OS: ${{ matrix.os }}
    steps:
      - run: |
          pacman -Syu --noconfirm --needed stow just git zsh jq
          mkdir -p "$HOME/stub"
          cat > "$HOME/stub/sudo" <<'EOF'
          #!/bin/sh
          exec "$@"
          EOF
          for pm in pacman apt-get; do
            cat > "$HOME/stub/$pm" <<'EOF'
          #!/bin/sh
          echo "$0 $*" >> "$HOME/pm.log"
          EOF
          done
          chmod +x "$HOME"/stub/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Real files already in the way: the install must move them aside, not abort.
      - name: A home that already has dotfiles
        run: |
          mkdir -p "$HOME/.config/git"
          echo 'export PRE=1' > "$HOME/.zshrc"
          printf '[user]\n\tname = Someone\n' > "$HOME/.gitconfig"
          echo '*.swp' > "$HOME/.config/git/ignore"
      - name: Run the installer
        run: |
          set -o pipefail
          export PATH="$HOME/stub:$PATH"
          # safe.directory through the environment: a --global write would create
          # ~/.gitconfig in the scratch home and make stowing git conflict.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          case "$OS" in
            arch)   bash install.sh 2>&1 | tee "$HOME/install.log" ;;
            ubuntu) bash ubuntu/install-ubuntu.sh 2>&1 | tee "$HOME/install.log" ;;
          esac
      - name: Profile and manifest reached their targets
        run: |
          test -L "$HOME/.gitconfig.local"
          test -L "$HOME/.zshrc"
          test -L "$HOME/.gitconfig"
          for f in .zshrc .gitconfig .config/git/ignore; do
            test -f "$HOME"/.dotfiles-backup/*/"$f"
          done
          grep -q ' waybar' "$HOME/pm.log"
          grep -q 'warn' "$HOME/install.log"
      - name: Arch path warned about the submodule, skipped /etc and generated a theme
        if: matrix.os == 'arch'
        run: |
          grep -q 'could not initialize claude-config submodule' "$HOME/install.log"
          grep -q 'Skipped system tuning' "$HOME/install.log"
          test -f "$HOME/.config/hypr/colors.lua"
          test ! -e /home/swapfile
      # The real pacman, against the synced db from the first step: every manifest
      # name and its dependencies must resolve, nothing is downloaded.
      - name: Arch manifest resolves
        if: matrix.os == 'arch'
        shell: bash
        run: |
          source shared/scripts/config.sh
          mapfile -t pkgs < <(pkgs_from arch/packages/desktop.txt)
          pacman -Sp --needed "${pkgs[@]}" >/dev/null

  # Same contract for the apt manifest, on a stock Ubuntu runner.
  apt-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          source shared/scripts/config.sh
          mapfile -t pkgs < <(pkgs_from ubuntu/packages/desktop.txt)
          sudo apt-get update -q
          sudo apt-get install -y --dry-run "${pkgs[@]}" >/dev/null
