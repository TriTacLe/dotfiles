# Host-specific Hyprland overlay - Ubuntu T14s Gen 2i (Intel Iris Xe)
# Sourced from hyprland.conf when this package is stowed.

# Internal panel (FHD 1920x1080)
monitor = eDP-1, 1920x1080@60, 0x0, 1

# GPU env (Intel)
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl
env = WLR_NO_HARDWARE_CURSORS,1

# Synaptics precision touchpad (T14s)
input {
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}

# Brightness keys - bind both XF86 keycodes and F5/F6 to cover Fn-lock states
bind = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness_wob.sh down
bind = ,XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/brightness_wob.sh up
bind = ,F5, exec, ~/.config/hypr/scripts/brightness_wob.sh down
bind = ,F6, exec, ~/.config/hypr/scripts/brightness_wob.sh up
