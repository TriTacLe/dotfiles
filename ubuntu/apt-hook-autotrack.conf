// APT Hook - Auto-track packages after install/upgrade/remove
//
// Install with: ./ubuntu/install-hook.sh
// That creates /usr/local/bin/dotfiles-pkgtrack-ubuntu as a symlink to ubuntu/scripts/pkgtrack.sh
// and copies this file to /etc/apt/apt.conf.d/99dotfiles-autotrack
//
// This hook is machine-agnostic: it calls the symlink, which resolves to the
// pkgtrack.sh inside whichever clone of the dotfiles repo you set up.

DPkg::Post-Invoke {
    "if [ -x /usr/local/bin/dotfiles-pkgtrack-ubuntu ]; then /usr/local/bin/dotfiles-pkgtrack-ubuntu || true; fi";
};
