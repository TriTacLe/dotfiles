[env]
TERM = "xterm-256color"

[window]
opacity = 0.85
padding.x = 10
padding.y = 10
decorations = "Buttonless"
dynamic_title = true

[font]
normal.family = "JetBrainsMono Nerd Font"
bold.family = "JetBrainsMono Nerd Font"
italic.family = "JetBrainsMono Nerd Font"
bold_italic.family = "JetBrainsMono Nerd Font"
size = 10.0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 15
unfocused_hollow = true
thickness = 0.15

[scrolling]
history = 10000
multiplier = 3

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u001b[127;5u"

[[keyboard.bindings]]
key = "Backspace"
mods = "Alt"
chars = "\u001b[127;3u"

# Zoom keybindings
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[mouse]
hide_when_typing = true

[selection]
semantic_escape_chars = ",│`||:'' ()[]{}<>"
save_to_clipboard = true

[general]
live_config_reload = true
# Written by theme_apply.sh.
import = ["~/.config/alacritty/themes/current.toml"]
