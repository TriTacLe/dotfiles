#       ░░▒▒▓▓   ▓▓ YPRLAND config


# Monitor setup - see https://wiki.hyprland.org/Configuring/Monitors/
# Generic fallback + EDID-based rules in monitors.conf; host-specific override in host.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/host.conf


# Autostart applications
exec-once = dbus-update-activation-environment --systemd --all
exec-once = blueman-applet                    # Bluetooth tray icon
exec-once = nm-applet --no-agent --indicator  # Network tray icon
exec-once = hyprpm reload -n
exec-once = swaync
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/wallpaper-slideshow.sh
exec-once = waybar
exec-once = hyprctl dispatch workspace 3
exec-once = hypridle
exec-once = avizo-daemon  # Volume/brightness overlay
# exec-once = hyprswitch init --daemon  # Mac-like Alt+Tab


# Environment variables (GPU-specific env goes in per-host host.conf)

# GTK Theme
env = GTK_THEME,catppuccin-mocha-flamingo-standard+default

# Scaling
env = GDK_SCALE,1
env = XCURSOR_SIZE,21
env = GDK_DPI_SCALE,1
env = GNOME_KEYRING_CONTROL,/run/user/1000/keyring
env = ELECTRON_PASSWORD_STORE,gnome-libsecret

# XWayland scaling
xwayland {
    force_zero_scaling = true
}


# Input/keyboard/mouse
input {
    kb_layout = no  # Norwegian keyboard layout
    kb_model =
    kb_options = 
    kb_variant =
    kb_rules =
    
    follow_mouse = 1
    force_no_accel = 1
    sensitivity = -0.35
    
    touchpad {
        natural_scroll = yes
        disable_while_typing = no
        scroll_factor = 0.8
    }
    
    # Alternative keyboard options (disabled)
    # kb_options = caps:escape
    # kb_options = grp:lctrl_lalt_toggle
}

# Host-specific input device blocks go in per-host host.conf


# General settings
general {
    gaps_in = 4
    gaps_out = 7 7 0 7
    border_size = 3
    col.active_border = rgba(65b2ffff) 
    col.inactive_border = rgba(011423aa)
    layout = dwindle
    
# Assign workspaces to monitors (auto-detect monitors)
    # The first monitor will get workspaces 1-5, second gets 6-10, etc.
    # Commented out to prevent breakage - let user specify machines
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    vrr = 0
}

ecosystem:no_update_news = true


# Layout settings

dwindle {
    preserve_split = yes
}

master {
    # new_is_master = true
}

gestures {
    workspace_swipe_forever = true
    gesture = 3, horizontal, workspace
}


# Decoration - blur, shadows, etc
decoration {
    rounding = 14
    
    blur { 
        enabled = true
        size = 3
        passes = 4
        new_optimizations = yes
    }
    
    # Shadow settings (disabled)
    # drop_shadow = yes
    # shadow_range = 14
    
    # Layer rules (disabled)
    # layerrule = blur,waybar
    # layerrule = blur,wofi
}


# Import additional config files
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/workspaces.conf
# source = ~/.config/hypr/hyprgrass.conf  # re-enable after hyprpm builds on 0.55
# source = ~/.config/hypr/hyprexpo.conf   # re-enable after hyprpm builds on 0.55
