#hypridle.conf
general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = hyprlock    # lock before suspend.
  # to avoid having to press a key twice to turn on the display.
}

# listener {
#     timeout = 300  
#     on-timeout = hyprlock
#     on-resume = hyprctl dispatch dpms on
# }

listener {
    timeout = 300
    on-timeout = hyprlock
    # Old dispatcher name first, Lua expression as fallback. A Lua hyprland config
    # rejects the old name with exit 7, a hyprlang one rejects the Lua form.
    on-timeout = hyprctl dispatch dpms off || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch dpms on || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

