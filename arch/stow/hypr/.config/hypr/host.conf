# Host-specific Hyprland config for archlinux
# Sourced from hyprland.conf only when this package is stowed.

# Internal display (run `hyprctl monitors | grep description` to verify)
monitor = desc:AU Optronics 0x1092, preferred, 0x0, 1

# GPU env vars (uncomment if needed)
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
