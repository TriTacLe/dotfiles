# Host-specific Hyprland overlay - Arch desktop
# Sourced from hyprland.conf when this package is stowed.

# Internal display (run `hyprctl monitors | grep description` to verify)
monitor = desc:AU Optronics 0x1092, preferred, 0x0, 1

# GPU env (Intel iGPU - CometLake UHD)
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl

# Touchpad device (laptop)
device {
    name = elan1201:00-04f3:3098-touchpad
    sensitivity = +0.1
}

# Dock (nwg-dock works correctly on Arch, use wlr/taskbar in waybar on Ubuntu instead)
# Bottom edge, resting on waybar. The empty-workspace toggle lives in host.lua,
# which is the config Hyprland actually loads here.
exec-once = nwg-dock-hyprland -i 32 -nolauncher -l top -p bottom -o eDP-1
