# Power tuning that has to happen at module load.

# The Realtek RTS525A card reader sits at runtime_status=active with no card
# inserted and never suspends, so it draws its idle current the whole time the
# machine is on. Blacklisting the driver is the only way to stop that; the SD
# slot stops working entirely. Remove this line and rebuild the initramfs to
# get it back.
blacklist rtsx_pci

# Low-power PSM instead of the balanced default. Costs some wake latency on the
# wifi link.
options iwlmvm power_scheme=3
