# Drop-in over TLP's own defaults. Only settings that differ from 1.10.2 are
# listed, so anything absent here is deliberately left at the TLP default.
# Package watts are capped separately in cpu-tune.service; TLP has no RAPL
# setting, and everything below has to change again on every AC transition.

# On this chassis the fan is the constraint, not the wall socket, so AC gets the
# battery-ish policy rather than balance_performance. The ceiling of 80 percent
# lands near the base clock, which is where sustained load stops outrunning the
# heatsink. Turbo stays available on AC for short bursts and goes away on
# battery, where a 30 W idle draw costs more than the latency does.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MAX_PERF_ON_AC=80
CPU_MAX_PERF_ON_BAT=60
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# HWP dynamic boost ramps the core on IO wait. Useful on a machine with thermal
# headroom, counterproductive on one that is already fan-limited.
CPU_HWP_DYN_BOOST_ON_AC=0
CPU_HWP_DYN_BOOST_ON_BAT=0

# TLP ships these as "default", which means whatever firmware chose, and this
# firmware chooses nothing. Worth a couple of watts at idle.
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersupersave

# TLP's AC default is "on", which pins every device awake while plugged in.
# The Quadro is already on TLP's nouveau denylist, so this does not touch it.
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Autosuspending the bluetooth radio makes a paired mouse stutter on first move.
USB_EXCLUDE_BTUSB=1
