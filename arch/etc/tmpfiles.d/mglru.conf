# Protect the last second of working set from eviction. MGLRU is on by default
# since 6.1 but min_ttl_ms ships as 0, so nothing is protected and a memory
# spike thrashes instead of reclaiming. 1000 is the kernel doc's value for
# removing intolerable janks; higher risks premature OOM kills.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
