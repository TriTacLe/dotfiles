# sshd hardening drop-in — installed at /etc/ssh/sshd_config.d/99-hardening.conf
# Numbered 99 so it overrides earlier drop-ins (lowest-numbered key wins in sshd
# but settings already taken from the *first* occurrence — so 99 wins only for
# settings not yet set; we set them explicitly anyway).

# Authentication: keys only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# No root logins over SSH. Use sudo from the regular user.
PermitRootLogin no

# No empty passwords (defense in depth, should already be the default).
PermitEmptyPasswords no

# Limit who can SSH in — only the 'tri' user. Add more users space-separated.
AllowUsers tri

# Disconnect idle sessions after 10 min of no traffic, drop after 3 missed probes.
ClientAliveInterval 600
ClientAliveCountMax 3

# Reasonable login attempt limits.
MaxAuthTries 3
LoginGraceTime 30s

# Don't advertise the SSH banner more than necessary.
PrintMotd no
